[package]
name = "skriv"
version = "0.1.0"
description = "A Typora-style WYSIWYG markdown editor"
authors = []
edition = "2021"

[lib]
name = "skriv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard-manager = "2.3.2"
notify = "8"
tauri-plugin-single-instance = "2"

# Title-bar proxy icon (NSWindow representedFilename); already in Tauri's
# macOS dependency tree, declared here for direct use in platform.rs.
# default-features = false: the default feature enables every binding
# module, which feature-unification would force onto the shared build.
[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWindow",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
