<!--
  skriv app icon master.

  A gold Sowilo rune ("s", for skriv) inlaid in a slate tile. The two rune
  outlines in defs (rune88 = gold inlay, rune98 = backing/lip shape) are
  generated by rune_outline.py in this directory; every other layer
  references them via <use>. Regenerate every platform asset from this
  file with `make icon`.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="rune88" d="M 689.2 328.0 L 574.3 213.0 L 543.9 214.2 L 336.0 457.6 L 538.7 644.5 L 398.6 778.2 Q 483.2 819.1 539.0 765.9 L 667.3 643.5 L 458.0 450.4 L 578.1 309.8 L 547.7 311.0 L 564.8 328.0 Z"/>
    <path id="rune98" d="M 696.3 328.0 L 575.8 207.5 L 542.0 208.8 L 329.1 458.0 L 531.4 644.6 L 395.2 774.5 Q 486.7 822.7 542.4 769.5 L 674.6 643.4 L 464.9 450.0 L 580.0 315.2 L 546.2 316.5 L 557.7 328.0 Z"/>
    <rect id="tile" x="100" y="100" width="824" height="824" rx="185"/>
    <!-- Slate background, vertical -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e5765"/>
      <stop offset="0.55" stop-color="#343b46"/>
      <stop offset="1" stop-color="#1e222a"/>
    </linearGradient>
    <!-- Diagonal sheen, top-left -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <!-- Top hairline highlight -->
    <linearGradient id="hairline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Gold inlay, diagonal sweep -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="360" y1="250" x2="690" y2="790">
      <stop offset="0" stop-color="#ecc978"/>
      <stop offset="0.5" stop-color="#cf9a45"/>
      <stop offset="1" stop-color="#a1742f"/>
    </linearGradient>
    <!-- Polished sheen across the inlay -->
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="300" y1="700" x2="750" y2="280">
      <stop offset="0.30" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.54" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.70" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Warm glow behind the rune -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0c878" stop-opacity="0.25"/>
      <stop offset="0.75" stop-color="#f0c878" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft drop shadow under the tile -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <!-- Recess shadow pressed into the stone -->
    <filter id="recess" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft30">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <!-- Fine stone grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.015" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>
    </filter>
    <!-- Carved inset: dark inner shadow at top, catch-light at bottom -->
    <filter id="carve" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset in="SourceAlpha" dy="12" result="offDown"/>
      <feGaussianBlur in="offDown" stdDeviation="7" result="blurDown"/>
      <feComposite in="SourceAlpha" in2="blurDown" operator="out" result="topStrip"/>
      <feFlood flood-color="#2a1c08" flood-opacity="0.5" result="darkFill"/>
      <feComposite in="darkFill" in2="topStrip" operator="in" result="topShadow"/>
      <feOffset in="SourceAlpha" dy="-8" result="offUp"/>
      <feGaussianBlur in="offUp" stdDeviation="5" result="blurUp"/>
      <feComposite in="SourceAlpha" in2="blurUp" operator="out" result="bottomStrip"/>
      <feFlood flood-color="#fff2c8" flood-opacity="0.4" result="lightFill"/>
      <feComposite in="lightFill" in2="bottomStrip" operator="in" result="bottomLight"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="topShadow"/>
        <feMergeNode in="bottomLight"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <use href="#tile"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <g filter="url(#tileShadow)">
    <use href="#tile" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <g filter="url(#soft30)" fill="none">
      <path d="M 60 700 L 980 380" stroke="#000000" stroke-opacity="0.07" stroke-width="140"/>
      <path d="M 40 500 L 990 180" stroke="#ffffff" stroke-opacity="0.05" stroke-width="90"/>
      <path d="M 120 950 L 1000 620" stroke="#000000" stroke-opacity="0.06" stroke-width="110"/>
    </g>
    <rect width="1024" height="1024" filter="url(#grain)" opacity="0.10" style="mix-blend-mode: overlay"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#hairline)" stroke-width="3"/>

  <!-- Rune -->
  <ellipse cx="512" cy="512" rx="340" ry="370" fill="url(#glow)"/>
  <!-- recess shadow in the stone -->
  <use href="#rune98" fill="#000000" fill-opacity="0.45" filter="url(#recess)" transform="translate(0 8)"/>
  <!-- lit stone lip below, shadowed lip above -->
  <use href="#rune98" fill="#b6c1cf" fill-opacity="0.20" transform="translate(0 4)"/>
  <use href="#rune98" fill="#0d0c09" fill-opacity="0.78" transform="translate(0 -3)"/>
  <!-- gold inlay, with the sheen painted over it -->
  <use href="#rune88" fill="url(#gold)" filter="url(#carve)"/>
  <use href="#rune88" fill="url(#sweep)"/>
</svg>
